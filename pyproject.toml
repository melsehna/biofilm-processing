[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "biofilm-processing"
version = "1.0.0"
description = "High-throughput biofilm phenotyping: image processing, segmentation, tracking, and feature extraction"
authors = [
  { name="Seh Na S. Mellick" }
]
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.9"
# Version ranges below are "will it install and run" bounds. The EXACT, validated
# versions used to produce published results are pinned in environment.yml (built
# from conda-forge, Python 3.9.23). Upper bounds on numpy/scipy track the last
# release supporting Python 3.9; the numerically-sensitive libs (numpy, scipy,
# scikit-image, mahotas) are capped at the next minor because their internals
# (label(), morphology, distance_transform_edt, Haralick) can shift feature values.
dependencies = [
    "numpy>=2.0,<2.1",
    "scipy>=1.13,<1.14",
    "scikit-image>=0.24,<0.25",
    "scikit-learn>=1.6,<1.7",
    "opencv-python>=4.9,<5",
    "mahotas>=1.4,<1.5",
    "pandas>=2.0,<3",
    "matplotlib>=3.8,<4",
    "tifffile>=2024.6",
    "imageio>=2.34,<3",
    "imageio-ffmpeg>=0.5,<1",
    "tqdm>=4.66,<5",
    "PySide6>=6.6,<7",
]

[project.optional-dependencies]
umap = [
    "umap-learn>=0.5.5,<0.6",
    "pyarrow>=15",
]
dev = [
    "pytest>=7",
    "ruff",
]

[tool.ruff]
line-length = 120
# Quarantined, unsupported modules — not maintained, so not linted.
extend-exclude = ["src/multiWellAnalysis/legacy"]

[tool.ruff.lint]
# The codebase is intentionally camelCase — do NOT enable pep8-naming (N).
# Keep the high-value defaults (pyflakes F: unused imports / undefined names;
# pycodestyle E) and drop line-length noise.
extend-ignore = ["E501"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["src/multiWellAnalysis/tests"]
pythonpath = ["src"]

[project.scripts]
biofilm-processing-gui = "multiWellAnalysis.gui.app:run"
biofilm-processing-run = "multiWellAnalysis.cli.run_pipeline:main"
biofilm-processing-test-well = "multiWellAnalysis.cli.test_well:main"
